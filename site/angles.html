tion>VIP bench cushion close</figcaption></figure><figure data-zone="Main Hall"><button type="button" class="frame" aria-label="View DJ deck equipment closer view"><img alt="DJ deck equipment closer view" loading="lazy" decoding="async" src="angles-media/138-thumb.jpg" data-full="angles-media/138.jpg"></button><figcaption>DJ deck equipment closer view</figcaption></figure></div><footer><a href="knight-library.glb">Final GLB</a> · The exterior orbit uses model bearings.</footer></main><dialog><div class="panel"><h2></h2><small></small><button type="button" id="prev" aria-label="Previous view">←</button><button type="button" id="next" aria-label="Next view">→</button><button type="button" id="close">Close</button></div><img alt=""></dialog><script>
const figures = Array.from(document.querySelectorAll('.grid figure'));
const controls = Array.from(document.querySelectorAll('nav button'));
const dialog = document.querySelector('dialog');
const enlarged = dialog.querySelector('img');
let shown = figures, index = 0;
for (const control of controls) {
  control.addEventListener('click', () => {
    const filter = control.dataset.filter;
    for (const button of controls) button.setAttribute('aria-pressed', String(button === control));
    for (const figure of figures) figure.hidden = filter !== 'All' && figure.dataset.zone !== filter;
    shown = figures.filter(figure => !figure.hidden);
    document.querySelector('.total').textContent = shown.length + ' views';
  });
}
function open(indexToOpen) {
  index = (indexToOpen + shown.length) % shown.length;
  const source = shown[index].querySelector('img');
  enlarged.src = source.dataset.full;
  enlarged.alt = source.alt;
  dialog.querySelector('h2').textContent = source.alt;
  dialog.querySelector('small').textContent = (index + 1) + ' / ' + shown.length;
  if (!dialog.open) dialog.showModal();
}
for (const figure of figures) figure.querySelector('button').addEventListener('click', () => open(shown.indexOf(figure)));
document.querySelector('#prev').addEventListener('click', () => open(index - 1));
document.querySelector('#next').addEventListener('click', () => open(index + 1));
document.querySelector('#close').addEventListener('click', () => dialog.close());
dialog.addEventListener('keydown', event => {
  if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
    event.preventDefault();
    open(index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
</script></body></html>
